# Main nginx config for Compose gateway.
# Does NOT modify the host's /etc/nginx — runs only inside the gateway container.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream mock_http {
        server app:3000;
        keepalive 32;
    }

    upstream mock_ws {
        server app:3001;
        keepalive 32;
    }

    upstream mock_grpc {
        server app:50051;
    }

    include /etc/nginx/conf.d/*.conf;
}

stream {
    upstream mock_mqtt {
        server app:1883;
    }

    include /etc/nginx/stream.d/*.conf;
}
