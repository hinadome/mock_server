# Production Compose stack: app (internal) + nginx FrontendGateway (public).
# Does not touch the host nginx installation.
#
# Usage: ./deploy/container/deploy.sh --domain api.example.com

name: mock-server

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: mock-server:local
    env_file:
      - .env.production
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      HOT_RELOAD: "0"
      TLS_ENABLED: "0"
    expose:
      - "3000"
      - "3001"
      - "50051"
      - "1883"
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "50051:50051"
      - "8883:8883"
      # Optional cleartext MQTT — enabled by deploy.sh when --mqtt-cleartext
      # - "1883:1883"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/runtime/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/runtime/stream.d:/etc/nginx/stream.d:ro
      - ./certs:/etc/nginx/ssl:ro
      - ./certbot-www:/var/www/certbot:ro
    networks:
      - internal
      - public
    restart: unless-stopped

networks:
  internal:
    driver: bridge
  public:
    driver: bridge
