# Dedicated gRPC TLS port (common when not multiplexing on 443)
server {
    listen 50051 ssl http2;
    listen [::]:50051 ssl http2;
    server_name DOMAIN_PLACEHOLDER;

    ssl_certificate     SSL_CERT_DIR_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key SSL_CERT_DIR_PLACEHOLDER/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        grpc_pass grpc://mock_grpc;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }
}
