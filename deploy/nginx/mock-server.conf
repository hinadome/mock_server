# Mock Server — nginx site (HTTP → app, WS upgrade, gRPC, MQTT stream)

# Public layout (production):
#   :443  HTTPS  → HTTP/SSE/HTTP Streams/GraphQL/dashboard + /ws/ → WebSocket app
#   :443  HTTP/2 → optional gRPC (grpc_pass)  OR use dedicated :50051
#   :8883 TLS    → MQTT broker (stream)
#   :1883        → MQTT cleartext (optional; often firewalled)
#
# App listens locally only (internal ports — must not collide with nginx public binds):
#   127.0.0.1:3000   HTTP / SSE / HTTP Streams / GraphQL
#   127.0.0.1:3001   WebSocket
#   127.0.0.1:15051  gRPC   (nginx public :50051 → here)
#   127.0.0.1:11883  MQTT   (nginx public :1883/:8883 → here)

upstream mock_http {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream mock_ws {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream mock_grpc {
    server 127.0.0.1:15051;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — WebSocket, HTTP, SSE, GraphQL (including graphql-ws)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN_PLACEHOLDER;

    ssl_certificate     SSL_CERT_DIR_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key SSL_CERT_DIR_PLACEHOLDER/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- Dedicated WebSocket app (production path on 443 → internal :3001) ---
    location /ws/ {
        proxy_pass http://mock_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- GraphQL HTTP + GraphQL subscriptions (graphql-ws on same path) ---
    location /graphql {
        proxy_pass http://mock_http;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # --- SSE (disable buffering) ---
    location /sse/ {
        proxy_pass http://mock_http;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # --- HTTP Streams / Fetch ReadableStream (chunked NDJSON; must not buffer) ---
    location /http-stream/ {
        proxy_pass http://mock_http;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Everything else (dashboard, REST, discovery, auth) ---
    location / {
        proxy_pass http://mock_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

