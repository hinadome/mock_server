# Mock Server — HTTP-only nginx site (no certificates).
# Use with: ./deploy/deploy.sh --domain HOST --no-tls
# Verify app functionality before enabling TLS / certbot.
#
# Public:
#   :80     HTTP / SSE / HTTP Streams / GraphQL / WS path / dashboard
#   :50051  gRPC cleartext (h2c)
#   :1883   MQTT cleartext (via streams-enabled cleartext conf)

upstream mock_http {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream mock_ws {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream mock_grpc {
    server 127.0.0.1:50051;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /ws/ {
        proxy_pass http://mock_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /graphql {
        proxy_pass http://mock_http;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    location /sse/ {
        proxy_pass http://mock_http;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    location /http-stream/ {
        proxy_pass http://mock_http;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://mock_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# gRPC cleartext (verify mode — no TLS)
server {
    listen 50051 http2;
    listen [::]:50051 http2;
    server_name DOMAIN_PLACEHOLDER;

    location / {
        grpc_pass grpc://mock_grpc;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }
}
