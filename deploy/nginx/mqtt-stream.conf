# MQTT TLS stream only (port 8883). Cleartext 1883 is optional — see mqtt-stream-cleartext.conf
# Requires: load_module modules/ngx_stream_module.so;
# Included via: include /etc/nginx/streams-enabled/*.conf;

upstream mock_mqtt {
    server 127.0.0.1:1883;
}

server {
    listen 8883 ssl;
    listen [::]:8883 ssl;
    proxy_pass mock_mqtt;

    ssl_certificate     SSL_CERT_DIR_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key SSL_CERT_DIR_PLACEHOLDER/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_connect_timeout 10s;
    proxy_timeout 1h;
}
